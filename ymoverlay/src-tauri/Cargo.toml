[package]
name = "ymoverlay"
version = "0.1.0"
description = "YouTube Music overlay controller"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Both players use Tauri webview DOM injection; no native audio API is required.
