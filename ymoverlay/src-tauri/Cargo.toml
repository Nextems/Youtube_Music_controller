[package]
name = "ymoverlay"
version = "0.1.0"
description = "YouTube Music overlay controller"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NOTE: we intentionally keep this dependency list minimal for Step 1.
# In Step 3 we'll likely add nothing extra here for DOM injection
# (webview.eval() is built into the `tauri` crate), and in Step 4 we may
# add a small crate for Windows per-process volume control (e.g. `windows`
# or `winapi`) — that's the only point where Rust code grows beyond boilerplate.
